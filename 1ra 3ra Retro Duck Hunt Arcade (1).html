<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Duck Hunt Arcade - Corrección de Spawn</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: min(800px, 100vw);
            aspect-ratio: 4 / 3;
            box-shadow: 0 0 30px rgba(0, 255, 128, 0.2), inset 0 0 50px rgba(0,0,0,0.5);
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
            cursor: crosshair;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #4ba3e3 0%, #a2d2ff 65%, #388e3c 65%, #1b4d13 100%);
        }
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 15px 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 3px 3px #000;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 6px;
            border: 2px solid #555;
            letter-spacing: 1px;
        }
        .top-bar span {
            color: #ffd700;
        }
        .bottom-bar {
            position: absolute;
            bottom: 20px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }
        .ammo-container {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 14px;
            border-radius: 6px;
            border: 2px solid #888;
        }
        .bullet {
            width: 10px;
            height: 24px;
            background: linear-gradient(to bottom, #ffe600, #ffb700);
            border-radius: 2px 2px 4px 4px;
            box-shadow: 0 0 5px rgba(255,215,0,0.5);
        }
        .bullet.spent {
            background: #444;
            box-shadow: none;
        }
        .reload-btn {
            background: linear-gradient(to bottom, #ffcc00, #cc9900);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            box-shadow: 0 4px #997300;
            transition: 0.08s;
        }
        .reload-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px #997300;
        }
        #menu, #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        h1 {
            font-size: 52px;
            color: #ffd700;
            text-shadow: 4px 4px #ff0000, 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            text-align: center;
        }
        p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .menu-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 12px 26px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            font-family: inherit;
            box-shadow: 0 5px #9b2226;
            transition: 0.1s;
        }
        .menu-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px #9b2226;
        }
        .menu-btn.selected {
            background: #2a9d8f;
            box-shadow: 0 5px #1d6f65;
        }
        .play-btn {
            background: #2ec4b6;
            color: #000;
            box-shadow: 0 5px #198278;
        }
        .play-btn:active {
            box-shadow: 0 1px #198278;
        }
        #game-over {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div class="hud">
            <div class="top-bar">
                <div>PUNTOS: <span id="score">0</span></div>
                <div>VIDAS: <span id="lives">3</span></div>
                <div>RONDA: <span id="wave">1</span></div>
            </div>
            <div class="bottom-bar">
                <div class="ammo-container" id="ammo-display">
                    <div class="bullet" id="b1"></div>
                    <div class="bullet" id="b2"></div>
                    <div class="bullet" id="b3"></div>
                </div>
                <button class="reload-btn" id="reload-btn">RECARGAR (R)</button>
            </div>
        </div>
        <div id="menu">
            <h1>DUCK HUNT ARCADE</h1>
            <p>Selecciona tu nivel de desafío:</p>
            <div class="btn-group">
                <button class="menu-btn selected" onclick="setDifficulty('easy', event)">FÁCIL (3 Vidas)</button>
                <button class="menu-btn" onclick="setDifficulty('medium', event)">MEDIO (3 Vidas)</button>
                <button class="menu-btn" onclick="setDifficulty('hard', event)">DIFÍCIL (1 Vida)</button>
            </div>
            <button class="menu-btn play-btn" onclick="startGame()">¡COMENZAR PARTIDA!</button>
        </div>
        <div id="game-over">
            <h1>¡FIN DEL JUEGO!</h1>
            <p>Puntuación Final: <span id="final-score">0</span></p>
            <button class="menu-btn play-btn" onclick="returnToMenu()">MENÚ PRINCIPAL</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'shot') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(25, now + 0.15);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'quack') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(380, now);
                    osc.frequency.linearRampToValueAtTime(240, now + 0.2);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'hit') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(580, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'reload') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(550, now);
                    osc.frequency.setValueAtTime(750, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'empty') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'laugh') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.setValueAtTime(340, now + 0.1);
                    osc.frequency.setValueAtTime(240, now + 0.2);
                    osc.frequency.setValueAtTime(340, now + 0.3);
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                }
            } catch(e) {}
        }
        let gameState = 'MENU';
        let score = 0;
        let lives = 3;
        let wave = 1;
        let ammo = 3;
        let maxAmmo = 3;
        let difficulty = 'easy';
        let ducks = [];
        let ducksSpawnedTotal = 0;
        let ducksTargetCount = 5;
        const diffSettings = {
            easy: { speed: 2.2, count: 6, lives: 3 },
            medium: { speed: 3.1, count: 9, lives: 3 },
            hard: { speed: 4.0, count: 12, lives: 1 }
        };
        let lion = {
            active: false,
            y: 600,
            animTimer: 0,
            message: "¡SE ESCAPÓ!"
        };
        const bottomLimitY = 390; // Línea de peligro inferior
        function setDifficulty(diff, event) {
            difficulty = diff;
            document.querySelectorAll('.btn-group .menu-btn').forEach(btn => btn.classList.remove('selected'));
            if(event && event.target) {
                event.target.classList.add('selected');
            }
        }
        function startGame() {
            initAudio();
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-over').style.display = 'none';
            score = 0;
            lives = diffSettings[difficulty].lives;
            wave = 1;
            ammo = 3;
            lion.active = false;
            gameState = 'PLAYING';
            updateHUD();
            startWave();
        }
        function returnToMenu() {
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            gameState = 'MENU';
        }
        function startWave() {
            ducks = [];
            ducksSpawnedTotal = 0;
            const cfg = diffSettings[difficulty];
            ducksTargetCount = cfg.count + (wave - 1) * 3;
            spawnDuckBatch();
        }
        function spawnDuckBatch() {
            if (gameState !== 'PLAYING' || lion.active) return;
            const cfg = diffSettings[difficulty];
            let flyingCount = ducks.filter(d => d.state === 'FLYING').length;
            let toSpawn = Math.min(3 - flyingCount, ducksTargetCount - ducksSpawnedTotal);
            if (toSpawn <= 0) return;
            for (let i = 0; i < toSpawn; i++) {
                ducksSpawnedTotal++;
                let x = Math.random() * (canvas.width - 150) + 75;
                let y = 360; // Nace de manera segura POR ENCIMA de la línea de peligro (390)
                // Ángulo inicial apuntando hacia arriba
                let angle = -Math.PI/2 + (Math.random() - 0.5) * Math.PI * 0.7;
                let speed = cfg.speed * (0.85 + Math.random() * 0.3);
                ducks.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed, // Negativo para que suba
                    radius: 35,
                    state: 'FLYING',
                    wingFrame: 0,
                    color: wave % 2 === 0 ? '#b22222' : '#2e6221',
                    reachedTop: false
                });
                playSound('quack');
            }
        }
        function triggerLion(msg) {
            lion.active = true;
            lion.y = 600;
            lion.animTimer = 0;
            lion.message = msg;
            playSound('laugh');
        }
        function reloadAmmo() {
            if (ammo < maxAmmo && gameState === 'PLAYING' && !lion.active) {
                ammo = maxAmmo;
                playSound('reload');
                updateHUD();
            }
        }
        document.getElementById('reload-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            reloadAmmo();
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                reloadAmmo();
            }
        });
        canvas.addEventListener('click', (e) => {
            if (gameState !== 'PLAYING' || lion.active) return;
            initAudio();
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * canvas.width / rect.width;
            const clickY = (e.clientY - rect.top) * canvas.height / rect.height;
            if (ammo <= 0) {
                playSound('empty');
                return;
            }
            ammo--;
            playSound('shot');
            updateHUD();
            for (let duck of ducks) {
                if (duck.state === 'FLYING') {
                    let dist = Math.hypot(duck.x - clickX, duck.y - clickY);
                    if (dist < duck.radius) {
                        duck.state = 'FALLING';
                        duck.vy = 10;
                        duck.vx = 0;
                        score += 100 * wave;
                        playSound('hit');
                        updateHUD();
                        break;
                    }
                }
            }
        });
        function updateHUD() {
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = lives;
            document.getElementById('wave').innerText = wave;
            for (let i = 1; i <= 3; i++) {
                const b = document.getElementById(`b${i}`);
                if (i <= ammo) {
                    b.classList.remove('spent');
                } else {
                    b.classList.add('spent');
                }
            }
        }
        function update() {
            if (gameState !== 'PLAYING') return;
            if (lion.active) {
                lion.animTimer++;
                if (lion.animTimer <= 30) {
                    lion.y = 600 - (lion.animTimer / 30) * 125;
                } else if (lion.animTimer > 70 && lion.animTimer <= 100) {
                    lion.y = 475 + ((lion.animTimer - 70) / 30) * 125;
                } else if (lion.animTimer > 100) {
                    lion.active = false;
                    if (lives <= 0) {
                        gameOver();
                    }
                }
                return;
            }
            let activeDucks = 0;
            let escapedCount = 0;
            for (let duck of ducks) {
                if (duck.state === 'FLYING') {
                    activeDucks++;
                    duck.x += duck.vx;
                    duck.y += duck.vy;
                    duck.wingFrame = (duck.wingFrame + 0.22) % 4;
                    // Rebotes en paredes laterales
                    if (duck.x < 40 || duck.x > canvas.width - 40) {
                        duck.x = Math.max(40, Math.min(canvas.width - 40, duck.x));
                        duck.vx *= -1;
                    }
                    // Si llegan arriba (cerca del techo), cambian de rumbo para empezar a BAJAR
                    if (duck.y < 80) {
                        duck.y = 80;
                        duck.reachedTop = true;
                        duck.vy = Math.abs(duck.vy); // Forzar velocidad hacia abajo
                    }
                    if (duck.reachedTop && duck.vy < 0) {
                        duck.vy *= -1;
                    }
                    // Si el pato cruza la línea hacia abajo
                    if (duck.y >= bottomLimitY) {
                        duck.state = 'ESCAPED';
                        escapedCount++;
                        playSound('quack');
                    }
                } else if (duck.state === 'FALLING') {
                    activeDucks++;
                    duck.y += duck.vy;
                    if (duck.y > canvas.height * 0.65) {
                        duck.state = 'DEAD';
                    }
                }
            }
            if (escapedCount > 0) {
                lives -= escapedCount;
                if (lives < 0) lives = 0;
                updateHUD();
                triggerLion("¡SE ESCAPÓ!");
                return;
            }
            if (activeDucks < 3 && ducksSpawnedTotal < ducksTargetCount && !lion.active) {
                spawnDuckBatch();
            }
            let allFinished = ducks.length > 0 && ducks.every(d => d.state === 'DEAD' || d.state === 'ESCAPED');
            if (allFinished && ducksSpawnedTotal >= ducksTargetCount && !lion.active) {
                wave++;
                startWave();
            }
        }
        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'flex';
        }
        function drawDuck(duck) {
            ctx.save();
            ctx.translate(duck.x, duck.y);
            if (duck.state === 'DEAD' || duck.state === 'ESCAPED') {
                ctx.restore();
                return;
            }
            if (duck.state === 'FALLING') {
                ctx.rotate(Math.PI);
                ctx.fillStyle = '#ff4500';
                ctx.fillRect(-15, -15, 30, 30);
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, -10, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                return;
            }
            if (duck.vx < 0) {
                ctx.scale(-1, 1);
            }
            // Cuerpo
            ctx.fillStyle = duck.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, 22, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            // Cabeza
            ctx.fillStyle = '#1b4d13';
            ctx.beginPath();
            ctx.arc(18, -6, 10, 0, Math.PI * 2);
            ctx.fill();
            // Pico
            ctx.fillStyle = '#ff9f1c';
            ctx.beginPath();
            ctx.moveTo(26, -8);
            ctx.lineTo(34, -6);
            ctx.lineTo(26, -4);
            ctx.closePath();
            ctx.fill();
            // Ojo
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(20, -8, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(21, -8, 1, 0, Math.PI * 2);
            ctx.fill();
            // Alas animadas
            ctx.fillStyle = duck.color;
            ctx.beginPath();
            let wingOffset = Math.sin(duck.wingFrame * Math.PI) * 16;
            ctx.ellipse(-2, -12 + wingOffset, 8, 14, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        function drawLion() {
            if (!lion.active) return;
            ctx.save();
            let lx = canvas.width / 2;
            let ly = lion.y;
            // Melena
            ctx.fillStyle = '#b5651d';
            ctx.beginPath();
            ctx.arc(lx, ly - 10, 48, 0, Math.PI * 2);
            ctx.fill();
            // Cara
            ctx.fillStyle = '#f4a261';
            ctx.beginPath();
            ctx.arc(lx, ly - 5, 34, 0, Math.PI * 2);
            ctx.fill();
            // Hocico
            ctx.fillStyle = '#e9c46a';
            ctx.beginPath();
            ctx.ellipse(lx, ly + 2, 20, 13, 0, 0, Math.PI * 2);
            ctx.fill();
            // Nariz
            ctx.fillStyle = '#1d3557';
            ctx.beginPath();
            ctx.arc(lx, ly - 2, 6, 0, Math.PI * 2);
            ctx.fill();
            // Ojos riéndose (curvados)
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(lx - 12, ly - 14, 6, Math.PI, 0, false);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(lx + 12, ly - 14, 6, Math.PI, 0, false);
            ctx.stroke();
            // Boca abierta
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(lx, ly + 10, 11, 0, Math.PI, false);
            ctx.fill();
            // Letrero de burla
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.font = 'bold 24px "Courier New"';
            ctx.textAlign = 'center';
            ctx.strokeText(lion.message, lx, ly - 55);
            ctx.fillText(lion.message, lx, ly - 55);
            ctx.restore();
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Arbustos de fondo
            ctx.fillStyle = '#14380e';
            ctx.beginPath();
            ctx.arc(90, 410, 85, 0, Math.PI * 2);
            ctx.arc(210, 390, 105, 0, Math.PI * 2);
            ctx.arc(630, 420, 95, 0, Math.PI * 2);
            ctx.arc(730, 395, 75, 0, Math.PI * 2);
            ctx.fill();
            // Dibujar línea discontinua de límite inferior
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 69, 0, 0.7)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 8]);
            ctx.beginPath();
            ctx.moveTo(0, bottomLimitY);
            ctx.lineTo(canvas.width, bottomLimitY);
            ctx.stroke();
            ctx.restore();
            drawLion();
            // Césped frontal
            ctx.fillStyle = '#1b4d13';
            ctx.fillRect(0, canvas.height - 65, canvas.width, 65);
            for (let duck of ducks) {
                drawDuck(duck);
            }
        }
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
