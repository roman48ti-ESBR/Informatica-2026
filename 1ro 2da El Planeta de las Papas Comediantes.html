 <!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>¡El Planeta de las Papas Comediantes! 🥔✨</title>

    <style>

        :root {

            --bg-color: #1a0b2e;

            --primary: #ff9f1c;

            --secondary: #ffbf69;

            --accent: #2ec4b6;

            --text-color: #ffffff;

            --potato-color: #c68b59;

        }

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        body {

            background: linear-gradient(135deg, #1a0b2e 0%, #3a105c 100%);

            color: var(--text-color);

            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;

            min-height: 100vh;

            overflow-x: hidden;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: space-between;

            padding: 20px;

            position: relative;

        }

        /* --- FONDO DE PAPAS VOLANDO --- */

        .flying-potato {

            position: absolute;

            font-size: 2rem;

            user-select: none;

            pointer-events: none;

            z-index: 0;

            animation: floatAround linear infinite;

            opacity: 0.7;

        }

        @keyframes floatAround {

            0% {

                transform: translateY(105vh) translateX(0) rotate(0deg);

            }

            50% {

                transform: translateY(50vh) translateX(50px) rotate(180deg);

            }

            100% {

                transform: translateY(-10vh) translateX(-50px) rotate(360deg);

            }

        }

        /* --- HEADER --- */

        header {

            text-align: center;

            z-index: 10;

            margin-top: 10px;

            background: rgba(0, 0, 0, 0.4);

            padding: 15px 30px;

            border-radius: 20px;

            border: 3px dashed var(--primary);

            box-shadow: 0 0 15px var(--primary);

        }

        header h1 {

            font-size: 2.2rem;

            color: var(--secondary);

            text-shadow: 3px 3px #000;

            margin-bottom: 5px;

        }

        header p {

            font-size: 1.1rem;

            color: var(--accent);

        }

        /* --- CONTENEDOR PRINCIPAL DE PAPAS BAILARINAS --- */

        .main-container {

            z-index: 10;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 30px;

            max-width: 1000px;

            margin: 30px 0;

            width: 100%;

        }

        /* Tarjeta de Papa */

        .potato-card {

            background: rgba(255, 255, 255, 0.1);

            border: 4px solid var(--secondary);

            border-radius: 25px;

            padding: 20px;

            width: 280px;

            text-align: center;

            backdrop-filter: blur(5px);

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);

            display: flex;

            flex-direction: column;

            align-items: center;

            transition: transform 0.3s;

        }

        .potato-card:hover {

            transform: scale(1.05);

        }

        /* Animación de baile para las papas */

        .dancing-potato {

            font-size: 5rem;

            cursor: pointer;

            display: inline-block;

            animation: dance 1.2s infinite ease-in-out alternate;

            user-select: none;

            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));

            position: relative;

        }

        @keyframes dance {

            0% {

                transform: rotate(-15deg) translateY(0);

            }

            100% {

                transform: rotate(15deg) translateY(-10px) scale(1.05);

            }

        }

        .potato-name {

            font-size: 1.3rem;

            color: var(--primary);

            margin: 10px 0 5px;

            font-weight: bold;

            text-shadow: 1px 1px #000;

        }

        /* Globo de diálogo del chiste */

        .speech-bubble {

            background: #ffffff;

            color: #333;

            padding: 12px;

            border-radius: 15px;

            font-size: 0.95rem;

            min-height: 80px;

            max-height: 110px;

            overflow-y: auto;

            margin: 10px 0;

            width: 100%;

            position: relative;

            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);

            border: 2px solid var(--accent);

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

        }

        /* Botón interactivo */

        .joke-btn {

            background-color: var(--primary);

            color: white;

            border: none;

            padding: 10px 20px;

            border-radius: 50px;

            font-family: inherit;

            font-weight: bold;

            font-size: 0.9rem;

            cursor: pointer;

            box-shadow: 0 4px 0 #b36b00;

            transition: all 0.1s ease;

            text-transform: uppercase;

        }

        .joke-btn:active {

            transform: translateY(4px);

            box-shadow: 0 0 0 #b36b00;

        }

        .joke-btn:hover {

            background-color: #ffaa33;

        }

        /* --- FOOTER --- */

        footer {

            z-index: 10;

            text-align: center;

            font-size: 0.9rem;

            color: var(--secondary);

            margin-bottom: 10px;

        }

        /* Responsive para celulares pequeños */

        @media (max-width: 600px) {

            header h1 {

                font-size: 1.6rem;

            }

            .main-container {

                gap: 20px;

            }

            .potato-card {

                width: 100%;

                max-width: 320px;

            }

        }

    </style>

</head>

<body>

    <!-- Contenedor dinámico de papas volando de fondo -->

    <div id="flying-container"></div>

    <header>

        <h1>🥔 ¡El Planeta de las Papas Comediantes! 🥔</h1>

        <p>¡Toca o haz clic en las papas bailarinas para escuchar sus mejores chistes!</p>

    </header>

    <div class="main-container" id="potato-container">

        <!-- Las tarjetas de papas se cargarán aquí por medio de JavaScript -->

    </div>

    <footer>

        <p>&copy; 2026 - Creado con mucho humor y almidón 🍟</p>

    </footer>

    <script>

        // Lista de chistes adecuados y divertidos de papas / comida

        const chistesDePapas = [

            "¿Qué le dice una papa a otra papa en la calle? — ¡Ay, mira, un ser-humano!",

            "¿Por qué las papas no luchan nunca entre ellas? — ¡Porque prefieren puré-se de paz!",

            "¿Qué hace una papa cuando está nerviosa? — ¡Se pone hecha un puré!",

            "¿Cómo se saludan dos papas al encontrarse en el supermercado? — ¡Hola y 'papa-frita'!",

            "¿Cuál es el colmo de una papa? — ¡Tener ojos y no poder ver la serie!",

            "¿Qué le dice una papa chef a su ayudante? — ¡No te pases de freír!",

            "¿Por qué la papa se metió a detective? — ¡Porque quería averiguar quién la peló!",

            "¿Qué hace una papa bajo la lluvia? — ¡Se convierte en papa empapada!",

            "¿Cuál es el superhéroe favorito de las papas? — ¡El Capitán Fritura!",

            "¿Por qué la papa fue al psicólogo? — ¡Porque sentía que todo el mundo la aplastaba!"

        ];

        // Datos de nuestras papas bailarinas con caras personalizadas

        const papasData = [

            { nombre: "Papa Fritilda", cara: "🥔😄" },

            { nombre: "Don Puré", cara: "🥔😎" },

            { nombre: "Papita Alegre", cara: "🥔🤪" }

        ];

        const container = document.getElementById('potato-container');

        // Función para obtener un chiste aleatorio

        function obtenerChisteAleatorio() {

            const index = Math.floor(Math.random() * chistesDePapas.length);

            return chistesDePapas[index];

        }

        // Renderizar las papas bailarinas principales

        function inicializarPapas() {

            container.innerHTML = '';

            papasData.forEach((papa, index) => {

                const card = document.createElement('div');

                card.className = 'potato-card';

                card.innerHTML = `

                    <div class="dancing-potato" id="dance-${index}" title="¡Tócame!">${papa.cara}</div>

                    <div class="potato-name">${papa.nombre}</div>

                    <div class="speech-bubble" id="bubble-${index}">

                        ¡Hola! Haz clic en el botón de abajo para escuchar mi chiste.

                    </div>

                    <button class="joke-btn" onclick="contarChiste(${index})">¡Cuéntame un chiste!</button>

                `;

                container.appendChild(card);

                // Permitir hacer clic también directamente en la papa bailarina

                document.getElementById(`dance-${index}`).addEventListener('click', () => {

                    contarChiste(index);

                });

            });

        }

        // Función para cambiar el texto del chiste con animación de rebote

        function contarChiste(index) {

            const bubble = document.getElementById(`bubble-${index}`);

            const dancer = document.getElementById(`dance-${index}`);

            // Efecto visual rápido al presionar

            dancer.style.transform = "scale(1.3) rotate(360deg)";

            setTimeout(() => {

                dancer.style.transform = "";

            }, 400);

            bubble.textContent = obtenerChisteAleatorio();

        }

        // Generar papas volando de fondo de forma aleatoria

        function crearFondoDePapas() {

            const flyingContainer = document.getElementById('flying-container');

            const cantidadPapas = 12;

            for (let i = 0; i < cantidadPapas; i++) {

                const span = document.createElement('span');

                span.className = 'flying-potato';

                span.textContent = Math.random() > 0.5 ? '🥔' : '🍟';

                // Posición horizontal aleatoria

                span.style.left = Math.random() * 100 + 'vw';

                // Duración de animación aleatoria para que floten a diferentes velocidades

                span.style.animationDuration = (Math.random() * 8 + 6) + 's';

                // Retraso aleatorio

                span.style.animationDelay = (Math.random() * 5) + 's';

                // Tamaño variable

                span.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';

                flyingContainer.appendChild(span);

            }

        }

        // Ejecutar al cargar la página

        window.onload = () => {

            inicializarPapas();

            crearFondoDePapas();

        };

    </script>

</body>

</html>
